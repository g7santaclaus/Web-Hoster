<!DOCTYPE html>
<html>
<head>
    <title>Linux in HTML with Networking</title>
    <script src="libv86.js"></script>
</head>
<body>
    <div id="screen_container" style="width: 800px; height: 600px;">
        <div style="white-space: pre; font: monospace;"></div>
    </div>
    <script>
        window.onload = function() {
            var emulator = new V86({
                screen_container: document.getElementById("screen_container"),
                bios: { url: "bios/seabios.bin" },
                vga_bios: { url: "bios/vgabios.bin" },
                cdrom: { url: "images/linux.iso" },
                autostart: true,
                // Enables user-space networking via a WebSocket relay server
                network_device: {
                    relay_url: "wss://your-websocket-relay-server.com/" 
                }
            });
        };
    </script>
</body>
</html>
